services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veridoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veridoc}
      POSTGRES_USER: ${POSTGRES_USER:-veridoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridoc123}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veridoc} -d ${POSTGRES_DB:-veridoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: veridoc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/veridoc}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-veridoc}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-veridoc123}
      AI_SERVICE_URL: http://ai-service-python:8000
      UPLOAD_DIR: /app/uploads
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ai-service-python:
    build:
      context: ./ai-service-python
      dockerfile: Dockerfile
    container_name: veridoc-ai-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CHUNK_SIZE: ${CHUNK_SIZE:-600}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      TOP_K: ${TOP_K:-5}
      MIN_SIMILARITY_SCORE: ${MIN_SIMILARITY_SCORE:-0.35}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://veridoc:veridoc123@postgres:5432/veridoc}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend-java:8080
    container_name: veridoc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend-java

volumes:
  pgdata:
