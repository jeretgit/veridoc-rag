spring:
  application:
    name: veridoc-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/veridoc}
    username: ${SPRING_DATASOURCE_USERNAME:veridoc}
    password: ${SPRING_DATASOURCE_PASSWORD:veridoc123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    # Local embedding of a large PDF is slow; keep the read timeout generous.
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:120000}

upload:
  dir: ${UPLOAD_DIR:./data/uploads}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
